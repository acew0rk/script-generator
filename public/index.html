<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCAT Script Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1>Scripts</h1>
          <button id="new-btn" type="button" title="Start a new script">+ New</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="history-empty">No saved scripts yet.</p>
      </aside>

      <main class="main">
        <section class="panel">
          <label class="field-label" for="transcript">Transcript</label>
          <textarea
            id="transcript"
            class="transcript"
            placeholder="Paste the video transcript here…"
            spellcheck="false"
          ></textarea>

          <div class="attach">
            <div id="dropzone" class="dropzone" tabindex="0">
              <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
              <span id="dropzone-text">
                Optional: attach or paste a screenshot of the question &amp; answer choices
              </span>
              <div id="image-preview" class="image-preview" hidden>
                <img id="image-thumb" alt="attached screenshot preview" />
                <button id="image-remove" type="button" title="Remove image">Remove</button>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="generate-btn" type="button" class="primary">Generate script</button>
            <span id="status" class="status" role="status" aria-live="polite"></span>
          </div>
        </section>

        <section class="panel output-panel">
          <div class="output-head">
            <label class="field-label">Script</label>
            <button id="copy-btn" type="button" hidden>Copy</button>
          </div>
          <div id="banner" class="banner" hidden></div>
          <article id="output" class="output">
            <p class="placeholder">The generated script will appear here.</p>
          </article>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
